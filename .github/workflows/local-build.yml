name: Local Debug Build

# For local use only, via `act` (workflow_dispatch, not triggered by push). Builds the
# debug APK with no Firebase App Distribution step -- installing it onto a device is left
# to you (e.g. `adb install`), not something this workflow does.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # GitHub-hosted runners already have the Android SDK preinstalled; this only matters
      # for local `act` runs (act sets env.ACT=true). See firebase-app-distribution.yml for
      # why this only bootstraps platform-tools + licenses rather than a full SDK install.
      - name: Set up Android SDK (act only)
        if: ${{ env.ACT }}
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        working-directory: app
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: app
        run: ./gradlew assembleDebug

      - name: Print APK path
        run: echo "Built app/build/outputs/apk/debug/app-debug.apk"
